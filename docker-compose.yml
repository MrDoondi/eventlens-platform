services:
  postgres:
    image: postgres:17
    container_name: eventlens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: eventlens
      POSTGRES_PASSWORD: eventlens
      POSTGRES_DB: eventlens

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eventlens-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

volumes:
  postgres_data: